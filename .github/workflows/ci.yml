name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Rayforce moves on its own: its head is tried against this code every
  # week, so a change to its wire is found here and not in production.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # A release this code is known to work with, and the branch where
        # the next one is being made.
        rayforce: [v3.0.2, dev]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The integration tests run against a real server, built from source.
      - uses: actions/checkout@v4
        with:
          repository: RayforceDB/rayforce
          ref: ${{ matrix.rayforce }}
          path: rayforce-src
      - name: Build Rayforce
        run: make -C rayforce-src release -j4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: The page's script parses
        run: node --check web/app.js
      - name: The example configuration is valid
        run: cargo run --quiet -- --check --config rfbouncer.example.toml
      - name: Test
        run: cargo test
        env:
          RAYFORCE_BIN: ${{ github.workspace }}/rayforce-src/rayforce
      - name: Release build
        run: cargo build --release --locked
