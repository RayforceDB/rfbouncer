name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Rayforce moves on its own: its head is tried against this code every
  # week, so a change to its wire is found here and not in production.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The released Rayforce, which speaks wire version 3, and the branch
        # where the next release is being made, which speaks 4. The whole
        # suite runs against each in the version it speaks.
        include:
          - rayforce: v3.0.2
            wire: 3
          - rayforce: dev
            wire: 4
        rayforce: [v3.0.2, dev]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The integration tests run against a real server, built from source.
      - uses: actions/checkout@v4
        with:
          repository: RayforceDB/rayforce
          ref: ${{ matrix.rayforce }}
          path: rayforce-src
      - name: Build Rayforce
        run: make -C rayforce-src release -j4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: The page's script parses
        run: node --check web/app.js
      - name: The example configuration is valid
        run: cargo run --quiet -- --check --config rfbouncer.example.toml
      - name: Test
        run: cargo test
        env:
          RAYFORCE_BIN: ${{ github.workspace }}/rayforce-src/rayforce
          RFBOUNCER_TEST_WIRE: ${{ matrix.wire }}
      - name: Release build
        run: cargo build --release --locked
      # Fifty clients through the bouncer for three seconds. It fails when
      # nothing is answered, never for being slow: a shared runner's speed
      # says nothing. docs/performance.md has the numbers that mean something.
      - name: Benchmark smoke run
        run: |
          rayforce-src/rayforce -p 5901 -U pw </dev/null &
          printf 'listen = "127.0.0.1:5900"\n[[pool]]\nname = "main"\nwire_version = %s\nbackend_password = "pw"\nbackends = ["127.0.0.1:5901"]\n' "$WIRE" > bench.toml
          ./target/release/rfbouncer --config bench.toml &
          for attempt in $(seq 50); do
            ./target/release/rfbench 127.0.0.1:5900 --wire "$WIRE" -n 1 > /dev/null && break
            sleep 0.2
          done
          ./target/release/rfbench 127.0.0.1:5900 --wire "$WIRE" -c 50 -d 3s
          kill %1 %2
        env:
          WIRE: ${{ matrix.wire }}

  # The page's script: its formatting, its address parsing and its charts,
  # under Node's own test runner with no package installed.
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The page's logic
        run: node --test web/test/*.test.js

  # A short run of every fuzz target: enough to see that each still builds,
  # still takes its seeds, and that the last change did not break an
  # invariant a few million inputs can reach. Long runs are done by hand;
  # docs/fuzzing.md says how.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A nightly compiler, for the fuzz targets alone
        run: rustup toolchain install nightly --profile minimal
      # The repository pins a stable compiler; the fuzz crate is built with
      # the nightly one, for the host as it is, so the sanitizer links.
      - name: Which host the targets are built for
        run: |
          echo "FUZZ_TARGET=$(rustc +nightly -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Every target for half a minute
        run: fuzz/run.sh 30
      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # How much of the code the suite runs, printed per file. Nothing fails on
  # a number: it is there to be read when deciding what to test next.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RayforceDB/rayforce
          ref: dev
          path: rayforce-src
      - name: Build Rayforce
        run: make -C rayforce-src release -j4
      - name: The tools that read the counters
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Line coverage of the whole suite
        run: cargo llvm-cov --summary-only | tee coverage.txt
        env:
          RAYFORCE_BIN: ${{ github.workspace }}/rayforce-src/rayforce
          RFBOUNCER_TEST_WIRE: 4
      - name: Publish the summary
        run: |
          {
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
