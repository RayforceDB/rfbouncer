[package]
name = "rfbouncer"
version = "0.1.0"
edition = "2024"
description = "One port in front of a pool of read-only Rayforce replicas, with request statistics and a report page"
license = "MIT"
repository = "https://github.com/RayforceDB/rfbouncer"
readme = "README.md"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
