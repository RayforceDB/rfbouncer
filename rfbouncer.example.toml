# rfbouncer: one port in front of a pool of read-only Rayforce replicas.
# Every setting is shown with its default, except where a line says otherwise.
# Durations are written 500ms, 10s, 5m, 2h, 30d; sizes 4096, 64KiB, 16MiB.

# Clients, the admin console and the report pages all use this one port.
listen = "0.0.0.0:5000"
# An address for administration alone. With it, the admin console, the report
# pages and /metrics are served there only, and `listen` takes pool clients
# and /healthz (which is on both). Not set by default; needs a restart.
# admin_listen = "127.0.0.1:5050"

# Opens the admin console (user "rfbouncer") and the report pages (HTTP Basic,
# any user name). Without it there is neither.
admin_password = "change-me"
# Opens the report pages and /metrics only: for dashboards and scrapers that
# should not be able to pause a pool or stop the bouncer. Optional.
# report_password = "read-only"

max_client_conn = 10000
max_request_bytes = "16MiB"
# How long requests in flight are given to end when the bouncer is stopped.
shutdown_timeout = "30s"
# How long a client may sit between two requests; 0 is forever.
client_idle_timeout = "0"
# Open the port so that a second rfbouncer may open it too (SO_REUSEPORT).
# That is how a new process takes over from the old one without a client
# being refused: see "Restarting without dropping clients" in the README.
# With it on, starting a second process by mistake is not an error either.
# Needs a restart to change.
reuse_port = false

# An address refused this many logins within the window is locked out for the
# period: every login from it is refused, the right password included, over
# IPC and HTTP alike. 0 turns it off. Clients behind one NAT or proxy share
# an address and are locked out together: raise the number or use 0 there.
auth_lockout_failures = 10
auth_lockout_window = "1m"
auth_lockout_period = "5m"

# TLS on the same port, beside clear text: HTTPS and IPC over TLS. Not set by
# default. The files are PEM, read at start and again on SIGHUP.
# [tls]
# cert = "/etc/rfbouncer/fullchain.pem"
# key = "/etc/rfbouncer/privkey.pem"
# # Refuse HTTP in clear text, /healthz excepted.
# require_for_http = false
# # Refuse IPC in clear text, the admin console included. Rayforce's own
# # client does not speak TLS: leave this off unless every client does.
# require_for_ipc = false

[stats]
# The Rayforce process that keeps the request statistics. Without it nothing
# is recorded and the report pages show only the live state. Changing this
# section needs a restart.
#
# It is a process of its own, not one of a pool's replicas, and it takes
# writes: start it with -u, not -U, and with a journal so that what it holds
# survives a restart:
#
#     rayforce -p 5100 -u stats-secret -L /var/lib/rfbouncer/stats
#
# The bouncer makes its tables there (rfb_agg, rfb_backend, rfb_client,
# rfb_status, rfb_fp, rfb_sample) and they are ordinary tables: query them
# with any Rayforce client.
rayforce = "127.0.0.1:5100"
password = "stats-secret"
wire_version = 4
# Keep the full text of the slowest and the failed requests. The text holds
# whatever values the client sent; turn this off if those must not be stored.
store_samples = true
retention_aggregates = "30d"
retention_samples = "7d"
# Distinct query shapes counted per minute; the rest are counted together.
max_fingerprints_per_minute = 2000
# Replace symbols in a query's shape with ? as numbers and strings are, so
# that (== sym 'AAPL) and (== sym 'MSFT) are one shape. For workloads that
# name many distinct symbols. The table after from:, the columns after by:,
# asc: and desc:, and a function's parameters stay.
normalize_symbols = false
# A directory on the store's host where the store keeps the days that are
# over, so that only the current day is in its memory. Reports read both.
# Nothing there is ever deleted: remove old days' directories yourself. Not
# set by default, and then everything stays in memory.
# disk = "/var/lib/rfbouncer/days"

[[pool]]
name = "main"
# The user names, from a client's credentials, that select this pool. With
# one pool every client lands in it and this may be left out.
users = ["app"]
# What clients must present. Without it, and with one pool, clients are not
# asked for credentials at all.
password = "client-secret"
# Takes the clients whose user names no pool.
default = true
# The wire version the replicas speak: 3 for Rayforce releases up to 3.0, 4
# for what comes after. A replica of the other version shows as down.
wire_version = 4
# The password the replicas were started with (-U).
backend_password = "replica-secret"
backends = ["10.0.0.1:5001", "10.0.0.1:5002", "10.0.0.1:5003"]
# How a replica is chosen for a request.
#   "free"         the next replica that is free. A request waits only when
#                  every replica is busy. The default.
#   "round_robin"  the next replica in turn, free or not. Every replica gets
#                  the same number of requests; a request may wait behind a
#                  slow one while another replica is idle.
mode = "free"
# Requests a replica runs at once. A Rayforce process evaluates one message
# at a time, so more than 1 only moves the queue into the replica.
slots = 1
# Keep out a replica that would let a write through, i.e. one not started
# with -U. Turn off only where the replicas are read-only by construction.
require_restricted = true
# Run a request again on another replica when its replica fails before any
# of the answer reached the client. Turn off if a replica exposes functions
# marked with .sys.trust that write.
retry = true
# Prefer the replica a client's address was served by last, so one client
# does not see replicas that lag each other by turns. Only under mode = "free".
affinity = false
# Requests that may wait for a free replica, and for how long. Past either,
# the client is answered with the error "busy".
queue_max = 1000
query_wait_timeout = "10s"
# How long a replica may take to start answering. Past it the request is
# cancelled and answered with "timeout"; 0 is no limit, and then a replica
# that hangs holds its request for good.
query_timeout = "30s"
# How long a client may take to receive an answer once it has begun. A
# client that reads slower than that is cut off, so it cannot hold a replica
# as long as it likes; 0 is no limit.
transfer_timeout = "60s"
# How long a replica has to answer a cancel before its connection is dropped
# and opened again.
cancel_grace = "5s"
connect_timeout = "5s"

# Whose answers are compressed, in Rayforce's own scheme, when they are over
# 2000 bytes. A replica does not do it for the bouncer beside it.
#   "remote"  clients on another host, as a Rayforce server does. The default.
#   "always"  every client.
#   "off"     nobody.
compress = "remote"
# The largest answer compressed. Compressing needs the whole answer in
# memory, up to twice this for each replica connection; a larger answer is
# passed on plain, as it comes.
compress_max_bytes = "16MiB"

# The result cache: how long an answer may be given again to a request of
# the same bytes without asking a replica. 0 keeps nothing. An answer may be
# this old, whatever changed on the replicas meanwhile, and a request whose
# answer depends on the time or on chance gets the same one for this long.
cache_ttl = "0"
# The most memory the kept answers and their requests may take; the oldest
# go first.
cache_max_bytes = "64MiB"
# The largest answer kept, counted together with its request.
cache_max_entry = "1MiB"

# A replica connection that has been idle for health_check_interval is sent
# a request that costs nothing, and the replica has health_check_timeout to
# answer it. One that does not is taken for hung: its connection is dropped,
# it shows as down, and it is tried again like any replica that went away.
# Either setting at 0 turns the check off, and so does slots above 1.
# The answer comes from the replica's one evaluating thread, so the limit
# must be longer than anything a replica does that is not a request of this
# bouncer: a timer of its own, a query from a client that connects to it
# directly or through another bouncer.
health_check_interval = "10s"
health_check_timeout = "5s"

# What each replica is doing, as it says itself. A Rayforce that has a status
# stream is asked, over a connection kept for that alone, to report this
# often: whether it is idle, what it is running, how busy its main loop is,
# its CPU and its memory. The report pages, "show servers" and /metrics show
# it under every mode. Between 100ms and 10s; "0" asks no replica. A replica
# without the stream is used as before and asked again only rarely.
status_interval = "1s"
# A third way to choose a replica, which reads those reports:
#   "least_loaded"  as "free", but among the free replicas the one whose main
#                   loop was least busy over the last interval, and one that
#                   is running work the bouncer did not send (a client
#                   connected to it directly, a timer of its own) only when
#                   every free replica is. A replica within a fifth of its
#                   memory limit counts as more loaded the nearer it is.
#                   A replica without a status stream counts as carrying
#                   the average load of the free ones that have one. No
#                   request waits for a replica to look better while another
#                   is free.
# mode = "least_loaded"
